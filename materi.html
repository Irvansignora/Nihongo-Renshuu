<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nihongo Renshuu — Materi JFT Basic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="curriculum.js"></script>
<style>
:root{
  --bg:#0d0d0f;--surface:#16161a;--surface2:#1e1e24;--surface3:#252530;
  --border:#2a2a35;--border2:#363640;
  --ink:#f0ede8;--ink2:#9a9aaa;--ink3:#5a5a6a;
  --accent:#e8533a;--gold:#d4a847;--green:#3db87a;--blue:#4a9eff;--purple:#8b6cf7;
  --font:'DM Sans',sans-serif;--font-serif:'DM Serif Display',serif;--font-mono:'IBM Plex Mono',monospace;
  --r:12px;--shadow:0 4px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100vh;overflow-x:hidden}

/* ── LAYOUT ── */
#app{display:flex;min-height:100vh}
.sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow:hidden}
.main{margin-left:260px;flex:1;min-height:100vh;display:flex;flex-direction:column}

/* ── SIDEBAR ── */
.sb-head{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.sb-logo{font-family:var(--font-serif);font-size:20px}
.sb-logo span{color:var(--accent)}
.sb-sub{font-size:11px;color:var(--ink3);margin-top:3px;font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase}
.sb-back{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink3);margin-top:12px;cursor:pointer;transition:.15s}
.sb-back:hover{color:var(--accent)}

.sb-units{flex:1;overflow-y:auto;padding:8px}
.unit-btn{width:100%;padding:10px 12px;border-radius:8px;border:none;background:none;color:var(--ink2);text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:10px;font-family:var(--font);font-size:13px;margin-bottom:2px}
.unit-btn:hover{background:var(--surface2);color:var(--ink)}
.unit-btn.active{background:rgba(232,83,58,.12);color:var(--accent)}
.unit-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;font-family:var(--font-mono)}
.unit-info{flex:1;min-width:0}
.unit-info .utitle{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-info .usub{font-size:11px;color:var(--ink3);margin-top:1px}
.unit-progress{font-family:var(--font-mono);font-size:10px;flex-shrink:0}

.lesson-list{padding:0 8px 4px 16px}
.lesson-btn{width:100%;padding:7px 10px;border-radius:6px;border:none;background:none;color:var(--ink3);text-align:left;cursor:pointer;transition:.15s;font-family:var(--font);font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:1px}
.lesson-btn:hover{background:var(--surface2);color:var(--ink2)}
.lesson-btn.active{background:rgba(232,83,58,.1);color:var(--accent)}
.lesson-btn.done::before{content:'✓';color:var(--green);margin-right:2px;font-size:10px}
.lesson-type-icon{font-size:12px;flex-shrink:0}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:50;background:rgba(13,13,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-breadcrumb{font-size:13px;color:var(--ink3)}
.topbar-breadcrumb span{color:var(--ink)}
.topbar-right{display:flex;gap:10px}
.tb-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--ink2);font-family:var(--font);font-size:13px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.tb-btn:hover{background:var(--surface2);color:var(--ink);border-color:var(--border2)}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.tb-btn.primary:hover{background:#d4432a}

/* ── CONTENT ── */
.content{flex:1;padding:32px;max-width:860px}

/* ── LESSON HEADER ── */
.lesson-header{margin-bottom:32px}
.lesson-type-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.lesson-header h1{font-family:var(--font-serif);font-size:36px;line-height:1.1;margin-bottom:8px}
.lesson-header .lh-meta{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--ink3)}
.lesson-header .lh-meta span{display:flex;align-items:center;gap:5px}

/* ── INTRO BOX ── */
.intro-box{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:16px 20px;margin-bottom:28px;font-size:15px;line-height:1.7;color:var(--ink2)}

/* ── SECTION ── */
.section{margin-bottom:32px}
.section-heading{font-family:var(--font-serif);font-size:22px;margin-bottom:14px;display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}

/* ── TABLE ── */
.jp-table{width:100%;border-collapse:collapse;margin:12px 0 20px;font-size:14px}
.jp-table th{background:var(--surface2);color:var(--ink2);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
.jp-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.jp-table tr:last-child td{border-bottom:none}
.jp-table tr:hover td{background:rgba(255,255,255,.02)}
.jp-table td:first-child{font-family:var(--font-mono);font-size:16px;color:var(--ink)}
.cell-jp{font-size:20px!important;font-weight:600}

/* ── VOCAB CARDS ── */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0 20px}
.vocab-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:.2s;position:relative}
.vocab-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:var(--shadow)}
.vocab-card.flipped{background:var(--surface2);border-color:var(--accent)}
.vocab-card .vc-jp{font-size:22px;font-weight:700;margin-bottom:4px;line-height:1.2}
.vocab-card .vc-reading{font-size:12px;color:var(--ink3);font-family:var(--font-mono);margin-bottom:6px}
.vocab-card .vc-id{font-size:13px;color:var(--ink2);line-height:1.4}
.vocab-card .vc-note{font-size:11px;color:var(--ink3);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);line-height:1.4}
.vocab-card .vc-badge{position:absolute;top:10px;right:10px;font-size:9px;background:var(--surface2);color:var(--ink3);padding:2px 6px;border-radius:4px}

/* ── EXAMPLE BOX ── */
.example-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 22px;margin:8px 0 16px}
.example-box .ex-jp{font-size:18px;font-weight:500;line-height:1.7;margin-bottom:8px;white-space:pre-line}
.example-box .ex-id{font-size:13px;color:var(--ink2);line-height:1.6;white-space:pre-line}
.example-box .ex-note{font-size:12px;color:var(--ink3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.ex-tts-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--ink2);cursor:pointer;transition:.15s;margin-top:10px;display:inline-flex;align-items:center;gap:5px;font-family:var(--font)}
.ex-tts-btn:hover{background:var(--surface3);color:var(--ink)}

/* ── TIP BOX ── */
.tip-box{background:rgba(212,168,71,.08);border:1px solid rgba(212,168,71,.25);border-radius:var(--r);padding:14px 18px;font-size:13px;color:var(--gold);line-height:1.6;margin:20px 0}

/* ── DIALOG BOX ── */
.dialog-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:12px 0 20px}
.dialog-head{background:var(--surface2);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.dialog-head h3{font-size:14px;font-weight:600}
.dialog-tts-btn{background:var(--accent);color:white;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--font);transition:.15s}
.dialog-tts-btn:hover{background:#d4432a}
.dialog-tts-btn.playing{background:var(--green)}
.dialog-tts-btn .spd-btn{background:rgba(255,255,255,.15);border:none;border-radius:4px;padding:3px 7px;font-size:11px;color:white;cursor:pointer;font-family:var(--font-mono);margin-left:4px}
.dialog-body{padding:20px}
.dialog-script{background:var(--surface2);border-radius:8px;padding:16px;font-size:14px;line-height:2;white-space:pre-line;color:var(--ink);margin-bottom:14px}
.dialog-translation{font-size:13px;color:var(--ink3);line-height:1.8;white-space:pre-line;padding:12px 16px;background:rgba(255,255,255,.02);border-radius:8px;border:1px solid var(--border)}
.dialog-questions{margin-top:16px;display:grid;gap:10px}
.dq-item{background:var(--surface2);border-radius:8px;padding:12px 16px}
.dq-q{font-size:14px;font-weight:600;margin-bottom:6px}
.dq-sub{font-size:12px;color:var(--ink3);margin-bottom:10px}
.dq-toggle{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--ink3);cursor:pointer;font-family:var(--font);transition:.15s}
.dq-toggle:hover{border-color:var(--accent);color:var(--accent)}
.dq-answer{margin-top:10px;display:none;background:rgba(61,184,122,.08);border:1px solid rgba(61,184,122,.2);border-radius:6px;padding:10px 14px;font-size:13px;color:var(--green)}

/* ── READING ── */
.reading-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:12px 0 24px}
.reading-head{background:var(--surface2);padding:14px 20px;border-bottom:1px solid var(--border)}
.reading-head h3{font-size:14px;font-weight:600}
.reading-body{padding:20px}
.reading-text{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:18px 20px;font-size:14px;line-height:2;white-space:pre-line;font-family:var(--font-mono);margin-bottom:8px}
.reading-translation{font-size:12px;color:var(--ink3);line-height:1.7;white-space:pre-line;padding:12px;background:rgba(255,255,255,.02);border-radius:6px;margin-bottom:16px}
.reading-qs{display:grid;gap:12px}
.rq-item{background:var(--surface2);border-radius:10px;padding:14px 18px}
.rq-q{font-size:14px;font-weight:600;margin-bottom:4px}
.rq-sub{font-size:12px;color:var(--ink3);margin-bottom:12px}
.rq-choices{display:grid;gap:6px}
.rq-choice{padding:9px 14px;background:var(--surface3);border:1.5px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px}
.rq-choice:hover{border-color:var(--accent);color:var(--ink)}
.rq-choice.correct{background:rgba(61,184,122,.1);border-color:var(--green);color:var(--green)}
.rq-choice.wrong{background:rgba(232,83,58,.08);border-color:var(--red);color:var(--red);opacity:.6}
.rq-choice .choice-key{width:24px;height:24px;border-radius:5px;background:var(--border);font-family:var(--font-mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.rq-choice.correct .choice-key{background:var(--green);color:white}
.rq-choice.wrong .choice-key{background:var(--red);color:white}
.rq-choice:disabled,.rq-choices.answered .rq-choice{pointer-events:none}
.rq-choice.answered-correct{background:rgba(61,184,122,.1);border-color:var(--green)}

/* ── PROGRESS TRACKER ── */
.lesson-nav{display:flex;align-items:center;justify-content:space-between;padding:24px 0;border-top:1px solid var(--border);margin-top:32px}
.ln-prev,.ln-next{display:flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--border);border-radius:10px;font-size:13px;cursor:pointer;transition:.15s;background:transparent;color:var(--ink2);font-family:var(--font)}
.ln-prev:hover,.ln-next:hover{background:var(--surface2);color:var(--ink);border-color:var(--border2)}
.ln-done{padding:10px 24px;background:var(--green);color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s;display:flex;align-items:center;gap:8px}
.ln-done:hover{background:#2da068}

/* ── HOME / OVERVIEW ── */
.overview{padding:32px}
.overview-hero{margin-bottom:32px}
.overview-hero h1{font-family:var(--font-serif);font-size:40px;line-height:1.1;margin-bottom:10px}
.overview-hero h1 em{color:var(--accent);font-style:italic}
.overview-hero p{font-size:15px;color:var(--ink2);line-height:1.7;max-width:600px}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.unit-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.unit-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border2)}
.uc-top{height:4px}
.uc-body{padding:22px}
.uc-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;font-family:var(--font-mono);margin-bottom:14px;flex-shrink:0}
.uc-title{font-size:17px;font-weight:700;margin-bottom:4px}
.uc-sub{font-size:12px;color:var(--ink3);margin-bottom:8px;font-family:var(--font-mono)}
.uc-desc{font-size:13px;color:var(--ink2);line-height:1.5;margin-bottom:14px}
.uc-footer{display:flex;align-items:center;justify-content:space-between}
.uc-count{font-size:12px;color:var(--ink3)}
.uc-progress-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:0 12px}
.uc-progress-fill{height:100%;border-radius:2px;transition:width .5s}
.uc-pct{font-family:var(--font-mono);font-size:11px;color:var(--ink3);width:32px;text-align:right}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);color:var(--ink);padding:12px 20px;border-radius:10px;font-size:14px;z-index:9999;transform:translateX(120%);transition:.3s;box-shadow:var(--shadow)}
.toast.show{transform:translateX(0)}
.toast.success{border-color:var(--green)}

/* ── RESPONSIVE ── */
@media(max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.content{padding:20px}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── THEORY TEXT ── */
.theory-text{font-size:14px;color:var(--ink2);line-height:1.7;white-space:pre-line;margin:8px 0 16px;padding:14px 18px;background:var(--surface2);border-radius:8px}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">Nihongo<span>Renshuu</span></div>
      <div class="sb-sub">JFT Basic · Materi</div>
      <div class="sb-back" onclick="goBack()">← Kembali ke LMS</div>
    </div>
    <div class="sb-units" id="sb-units"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="tb-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none;padding:7px 10px" id="mob-menu-btn">☰</button>
        <div class="topbar-breadcrumb" id="tb-bread">Materi JFT Basic</div>
      </div>
      <div class="topbar-right">
        <button class="tb-btn" id="tts-lesson-btn" onclick="readLesson()" style="display:none">🔊 Baca</button>
        <button class="tb-btn primary" onclick="goLMS()">← Kembali ke LMS</button>
      </div>
    </div>

    <div id="page-overview" class="overview">
      <div class="overview-hero">
        <h1>Materi <em>JFT Basic</em></h1>
        <p>Kurikulum lengkap JFT Basic A1–A2. Mencakup aksara, kosakata, tata bahasa, listening, dan reading. Klik unit untuk mulai belajar.</p>
      </div>
      <div class="overview-grid" id="overview-grid"></div>
    </div>

    <div id="page-lesson" style="display:none">
      <div class="content" id="lesson-content"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let progress = JSON.parse(localStorage.getItem('np_materi_progress') || '{}');
let currentUnit = null;
let currentLesson = null;
let currentTTSIdx = 0;
let ttsSpeed = 1;
const ttsSpeedCycle = [1, 0.85, 0.7];

// ── INIT ──
function init() {
  renderSidebar();
  renderOverview();
  if(window.innerWidth < 900) document.getElementById('mob-menu-btn').style.display = 'flex';
}

function goBack() { goLMS(); }
function goLMS() { window.location.href = 'index.html'; }

// ── SIDEBAR ──
function renderSidebar() {
  const jft = CURRICULUM.jft;
  const sb = document.getElementById('sb-units');
  sb.innerHTML = '';
  jft.units.forEach(unit => {
    const doneCount = unit.lessons.filter(l => progress[l.id]).length;
    const pct = Math.round(doneCount / unit.lessons.length * 100);

    const uBtn = document.createElement('div');
    uBtn.className = 'unit-btn' + (currentUnit?.id === unit.id ? ' active' : '');
    uBtn.innerHTML = `
      <div class="unit-icon" style="background:${unit.color}22;color:${unit.color}">${unit.icon}</div>
      <div class="unit-info">
        <div class="utitle">${unit.title}</div>
        <div class="usub">${unit.subtitle}</div>
      </div>
      <span class="unit-progress" style="color:${pct===100?'var(--green)':'var(--ink3)'}">${pct}%</span>`;
    uBtn.onclick = () => toggleUnit(unit, uBtn);
    sb.appendChild(uBtn);

    const lList = document.createElement('div');
    lList.className = 'lesson-list';
    lList.id = 'llist-' + unit.id;
    lList.style.display = currentUnit?.id === unit.id ? 'block' : 'none';

    unit.lessons.forEach(lesson => {
      const lBtn = document.createElement('button');
      lBtn.className = 'lesson-btn' + (progress[lesson.id] ? ' done' : '') + (currentLesson?.id === lesson.id ? ' active' : '');
      lBtn.id = 'lbtn-' + lesson.id;
      const icons = {script:'あ', kanji:'字', vocab:'語', grammar:'文', listening:'🔊', reading:'📖', tips:'💡'};
      lBtn.innerHTML = `<span class="lesson-type-icon">${icons[lesson.type]||'📝'}</span>${lesson.title}`;
      lBtn.onclick = () => openLesson(unit, lesson);
      lList.appendChild(lBtn);
    });
    sb.appendChild(lList);
  });
}

function toggleUnit(unit, btn) {
  const lList = document.getElementById('llist-' + unit.id);
  const isOpen = lList.style.display === 'block';
  document.querySelectorAll('.lesson-list').forEach(l => l.style.display = 'none');
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
  if(!isOpen) { lList.style.display = 'block'; btn.classList.add('active'); currentUnit = unit; }
  else { currentUnit = null; }
}

// ── OVERVIEW ──
function renderOverview() {
  const jft = CURRICULUM.jft;
  const grid = document.getElementById('overview-grid');
  grid.innerHTML = jft.units.map(unit => {
    const done = unit.lessons.filter(l => progress[l.id]).length;
    const pct = Math.round(done / unit.lessons.length * 100);
    return `<div class="unit-card" onclick="openUnit('${unit.id}')">
      <div class="uc-top" style="background:${unit.color}"></div>
      <div class="uc-body">
        <div class="uc-icon" style="background:${unit.color}22;color:${unit.color}">${unit.icon}</div>
        <div class="uc-title">${unit.title}</div>
        <div class="uc-sub">${unit.subtitle}</div>
        <div class="uc-desc">${unit.description}</div>
        <div class="uc-footer">
          <span class="uc-count">${unit.lessons.length} pelajaran</span>
          <div class="uc-progress-bar"><div class="uc-progress-fill" style="width:${pct}%;background:${pct===100?'var(--green)':unit.color}"></div></div>
          <span class="uc-pct">${pct}%</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openUnit(unitId) {
  const unit = CURRICULUM.jft.units.find(u => u.id === unitId);
  if(!unit) return;
  currentUnit = unit;
  openLesson(unit, unit.lessons[0]);
  // Open sidebar entry
  document.querySelectorAll('.lesson-list').forEach(l => l.style.display = 'none');
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
  const lList = document.getElementById('llist-' + unit.id);
  if(lList) lList.style.display = 'block';
  const uBtns = document.querySelectorAll('.unit-btn');
  uBtns.forEach(btn => { if(btn.textContent.includes(unit.title)) btn.classList.add('active'); });
}

// ── LESSON RENDERER ──
function openLesson(unit, lesson) {
  currentUnit = unit;
  currentLesson = lesson;
  stopTTS();

  document.getElementById('page-overview').style.display = 'none';
  document.getElementById('page-lesson').style.display = 'block';
  document.getElementById('tts-lesson-btn').style.display = 'flex';
  document.getElementById('tb-bread').innerHTML = `<span>${unit.title}</span> › ${lesson.title}`;

  // Update active sidebar button
  document.querySelectorAll('.lesson-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById('lbtn-' + lesson.id);
  if(activeBtn) activeBtn.classList.add('active');

  const el = document.getElementById('lesson-content');
  el.innerHTML = buildLesson(unit, lesson);
  el.scrollTop = 0;
  window.scrollTo({top:0});
}

function buildLesson(unit, lesson) {
  const c = lesson.content;
  const typeLabels = {script:'Aksara',kanji:'Kanji',vocab:'Kosakata',grammar:'Tata Bahasa',listening:'Mendengarkan',reading:'Membaca',tips:'Tips & Strategi'};
  const typeColors = {script:'var(--blue)',kanji:'var(--purple)',vocab:'var(--green)',grammar:'var(--purple)',listening:'var(--accent)',reading:'var(--gold)',tips:'var(--gold)'};
  const typeIcons = {script:'あ',kanji:'字',vocab:'語',grammar:'文',listening:'🔊',reading:'📖',tips:'💡'};

  let html = `<div class="lesson-header">
    <div class="lesson-type-tag" style="background:${typeColors[lesson.type]}22;color:${typeColors[lesson.type]}">
      ${typeIcons[lesson.type]} ${typeLabels[lesson.type]}
    </div>
    <h1>${lesson.title}</h1>
    <div class="lh-meta">
      <span>⏱ ${lesson.duration}</span>
      <span style="color:${unit.color}">${unit.title}</span>
    </div>
  </div>`;

  if(c.intro) html += `<div class="intro-box">${esc(c.intro)}</div>`;

  // THEORY SECTIONS
  if(c.theory) {
    c.theory.forEach(t => {
      html += `<div class="section"><div class="section-heading">${esc(t.heading)}</div>`;
      if(t.text) html += `<div class="theory-text">${esc(t.text)}</div>`;
      if(t.table) html += buildTable(t.table);
      html += `</div>`;
    });
  }

  // VOCAB LIST
  if(c.vocabList) {
    html += `<div class="section"><div class="section-heading">📋 Daftar Kosakata <span style="font-size:14px;font-weight:400;color:var(--ink3);font-family:var(--font)">— klik kartu untuk flip</span></div>
    <div class="vocab-grid">`;
    c.vocabList.forEach((v,i) => {
      html += `<div class="vocab-card" onclick="flipVocab(this)" data-idx="${i}">
        <div class="vc-badge">${v.reading}</div>
        <div class="vc-jp">${esc(v.jp)}</div>
        <div class="vc-reading" style="margin-top:20px">${esc(v.reading)}</div>
        <div class="vc-id">${esc(v.id)}</div>
        ${v.note?`<div class="vc-note">💡 ${esc(v.note)}</div>`:''}
      </div>`;
    });
    html += `</div></div>`;
  }

  // EXAMPLES
  if(c.examples && c.examples.length > 0) {
    html += `<div class="section"><div class="section-heading">💬 Contoh Kalimat</div>`;
    c.examples.forEach((ex, i) => {
      html += `<div class="example-box">
        <div class="ex-jp">${esc(ex.jp)}</div>
        <div class="ex-id">${esc(ex.id)}</div>
        ${ex.note?`<div class="ex-note">📌 ${esc(ex.note)}</div>`:''}
        <button class="ex-tts-btn" onclick="ttsText(this,'${encodeURIComponent(ex.jp)}')">▶ Dengarkan</button>
      </div>`;
    });
    html += `</div>`;
  }

  // DIALOGS (Listening)
  if(c.dialogs) {
    html += `<div class="section"><div class="section-heading">🎙 Dialog Latihan</div>`;
    c.dialogs.forEach((d, di) => {
      html += `<div class="dialog-card" id="dialog-${di}">
        <div class="dialog-head">
          <h3>${esc(d.title)}</h3>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="dialog-tts-btn" id="tts-d${di}" onclick="ttsDialog(${di})">▶ Putar</button>
            <button class="tb-btn" style="padding:5px 10px;font-size:11px" onclick="cycleDialogSpeed(this)">1×</button>
          </div>
        </div>
        <div class="dialog-body">
          <div class="dialog-script" id="dscript-${di}">${esc(d.script)}</div>
          <details style="margin-bottom:14px">
            <summary style="cursor:pointer;font-size:12px;color:var(--ink3);padding:6px 0">📝 Lihat terjemahan</summary>
            <div class="dialog-translation" style="margin-top:8px">${esc(d.translation)}</div>
          </details>`;
      if(d.questions && d.questions.length > 0) {
        html += `<div class="dialog-questions">`;
        d.questions.forEach((q, qi) => {
          html += `<div class="dq-item">
            <div class="dq-q">${esc(q.q)}</div>
            <div class="dq-sub">${esc(q.qa)}</div>
            <button class="dq-toggle" onclick="toggleDQ(this,'${encodeURIComponent(q.a)}','${encodeURIComponent(q.aa)}')">Lihat Jawaban</button>
            <div class="dq-answer" id="dqa-${di}-${qi}"></div>
          </div>`;
        });
        html += `</div>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  }

  // READINGS
  if(c.readings) {
    html += `<div class="section"><div class="section-heading">📰 Teks Bacaan</div>`;
    c.readings.forEach((r, ri) => {
      html += `<div class="reading-card">
        <div class="reading-head"><h3>${esc(r.title)}</h3></div>
        <div class="reading-body">
          <div class="reading-text">${esc(r.text)}</div>
          ${r.translation?`<details><summary style="cursor:pointer;font-size:12px;color:var(--ink3);padding:4px 0;margin-bottom:8px">📝 Lihat terjemahan</summary><div class="reading-translation">${esc(r.translation)}</div></details>`:''}`;
      if(r.questions && r.questions.length > 0) {
        html += `<div class="reading-qs">`;
        r.questions.forEach((q, qi) => {
          const keys = ['A','B','C','D'];
          html += `<div class="rq-item">
            <div class="rq-q">${esc(q.q)}</div>
            <div class="rq-sub">${esc(q.qa)}</div>
            <div class="rq-choices" id="rqc-${ri}-${qi}">`;
          q.choices.forEach((ch, ci) => {
            const idAns = q.choices_id ? q.choices_id[ci] : ch;
            html += `<div class="rq-choice" onclick="answerRQ(this,'${encodeURIComponent(ch)}','${encodeURIComponent(q.a)}','rqc-${ri}-${qi}','${encodeURIComponent(q.aa)}')">
              <span class="choice-key">${keys[ci]}</span>
              <span>${esc(ch)} — ${esc(idAns)}</span>
            </div>`;
          });
          html += `</div></div>`;
        });
        html += `</div>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  }

  if(c.tip) html += `<div class="tip-box">${esc(c.tip)}</div>`;

  // NAV
  const allLessons = CURRICULUM.jft.units.flatMap(u => u.lessons.map(l => ({unit:u,lesson:l})));
  const cidx = allLessons.findIndex(x => x.lesson.id === lesson.id);
  const prev = cidx > 0 ? allLessons[cidx-1] : null;
  const next = cidx < allLessons.length-1 ? allLessons[cidx+1] : null;

  html += `<div class="lesson-nav">
    ${prev?`<button class="ln-prev" onclick="openLesson(CURRICULUM.jft.units.find(u=>u.id==='${prev.unit.id}'),CURRICULUM.jft.units.find(u=>u.id==='${prev.unit.id}').lessons.find(l=>l.id==='${prev.lesson.id}'))">← ${esc(prev.lesson.title)}</button>`:'<div></div>'}
    <button class="ln-done" onclick="markDone('${lesson.id}')">✓ Tandai Selesai</button>
    ${next?`<button class="ln-next" onclick="openLesson(CURRICULUM.jft.units.find(u=>u.id==='${next.unit.id}'),CURRICULUM.jft.units.find(u=>u.id==='${next.unit.id}').lessons.find(l=>l.id==='${next.lesson.id}'))">→ ${esc(next.lesson.title)}</button>`:'<div></div>'}
  </div>`;

  return html;
}

function buildTable(t) {
  let h = `<div style="overflow-x:auto"><table class="jp-table"><thead><tr>`;
  t.headers.forEach(hd => h += `<th>${esc(hd)}</th>`);
  h += `</tr></thead><tbody>`;
  t.rows.forEach(row => {
    h += '<tr>';
    row.forEach((cell, ci) => {
      const isJp = ci === 0 || (typeof cell === 'string' && /[\u3040-\u30ff\u4e00-\u9fff]/.test(cell));
      h += `<td class="${ci===0&&isJp?'cell-jp':''}">${esc(cell)}</td>`;
    });
    h += '</tr>';
  });
  h += `</tbody></table></div>`;
  return h;
}

// ── INTERACTIONS ──
function flipVocab(el) { el.classList.toggle('flipped'); }

function toggleDQ(btn, answer, answerID) {
  const parent = btn.closest('.dq-item');
  const ansEl = parent.querySelector('.dq-answer');
  if(ansEl.style.display === 'block') { ansEl.style.display = 'none'; btn.textContent = 'Lihat Jawaban'; return; }
  ansEl.innerHTML = `🇯🇵 ${decodeURIComponent(answer)}<br><span style="font-size:11px;color:var(--ink3)">🇮🇩 ${decodeURIComponent(answerID)}</span>`;
  ansEl.style.display = 'block';
  btn.textContent = 'Sembunyikan';
}

function answerRQ(el, selected, correct, groupId, correctID) {
  const group = document.getElementById(groupId);
  if(group.classList.contains('answered')) return;
  group.classList.add('answered');
  const isCorrect = decodeURIComponent(selected) === decodeURIComponent(correct);
  const choices = group.querySelectorAll('.rq-choice');
  choices.forEach(ch => {
    const chText = ch.querySelector('span:last-child').textContent;
    const chMatches = ch === el;
    if(ch.querySelector('span:last-child').textContent.startsWith(decodeURIComponent(correct).slice(0,5))) {
      ch.classList.add('correct');
      ch.querySelector('.choice-key').style.cssText = 'background:var(--green);color:white';
    }
    if(chMatches && !isCorrect) {
      ch.classList.add('wrong');
      ch.querySelector('.choice-key').style.cssText = 'background:var(--red);color:white';
    }
  });
  if(isCorrect) { showToast('✓ Benar! ' + decodeURIComponent(correctID), 'success'); }
  else { showToast('✗ Salah. Jawaban: ' + decodeURIComponent(correct)); }
}

// ── TTS ──
let currentDialogSpeech = null;
let dialogSpeedIdx = 0;
const dialogSpeeds = [1, 0.85, 0.7];

function stopTTS() {
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.dialog-tts-btn').forEach(b => { b.textContent = '▶ Putar'; b.classList.remove('playing'); });
}

function ttsDialog(idx) {
  const d = CURRICULUM.jft.units.flatMap(u => u.lessons).flatMap(l => l.content.dialogs||[]);
  const allDialogs = CURRICULUM.jft.units.flatMap(u => u.lessons.flatMap(l => (l.content.dialogs||[]).map((d,i) => ({d,unit:u,lesson:l,localIdx:i}))));
  // Find dialog by its rendered index in current lesson
  if(!currentLesson || !currentLesson.content.dialogs) return;
  const dialog = currentLesson.content.dialogs[idx];
  if(!dialog) return;

  const btn = document.getElementById('tts-d'+idx);
  if(window.speechSynthesis?.speaking) { stopTTS(); return; }

  if(!window.speechSynthesis) { showToast('Browser tidak mendukung TTS'); return; }
  const utt = new SpeechSynthesisUtterance(dialog.script);
  utt.lang = 'ja-JP';
  utt.rate = dialogSpeeds[dialogSpeedIdx];
  const voices = window.speechSynthesis.getVoices();
  const ja = voices.find(v => v.lang.startsWith('ja'));
  if(ja) utt.voice = ja;
  btn.textContent = '⏹ Berhenti'; btn.classList.add('playing');
  utt.onend = utt.onerror = () => { btn.textContent = '▶ Putar'; btn.classList.remove('playing'); };
  window.speechSynthesis.speak(utt);
}

function cycleDialogSpeed(btn) {
  dialogSpeedIdx = (dialogSpeedIdx+1) % dialogSpeeds.length;
  btn.textContent = ['1×','0.85×','0.7×'][dialogSpeedIdx];
  if(window.speechSynthesis?.speaking) { stopTTS(); }
}

function ttsText(btn, encodedText) {
  const text = decodeURIComponent(encodedText);
  if(!window.speechSynthesis) { showToast('TTS tidak didukung browser ini'); return; }
  if(window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); btn.textContent = '▶ Dengarkan'; return; }
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ja-JP'; utt.rate = 0.9;
  const ja = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('ja'));
  if(ja) utt.voice = ja;
  btn.textContent = '⏹ Berhenti';
  utt.onend = utt.onerror = () => btn.textContent = '▶ Dengarkan';
  window.speechSynthesis.speak(utt);
}

function readLesson() {
  if(!currentLesson) return;
  if(window.speechSynthesis?.speaking) { stopTTS(); return; }
  const text = (currentLesson.content.intro || '') + ' ' +
    (currentLesson.content.theory || []).map(t => t.heading + '. ' + (t.text||'')).join(' ');
  if(!text.trim() || !window.speechSynthesis) return;
  const utt = new SpeechSynthesisUtterance(text.slice(0,500));
  utt.lang = 'id-ID'; utt.rate = 0.9;
  window.speechSynthesis.speak(utt);
}

// ── PROGRESS ──
function markDone(lessonId) {
  progress[lessonId] = true;
  localStorage.setItem('np_materi_progress', JSON.stringify(progress));
  showToast('✓ Pelajaran ditandai selesai!', 'success');
  renderSidebar();
  renderOverview();
  const btn = document.getElementById('lbtn-' + lessonId);
  if(btn) btn.classList.add('done');
}

// ── UTILS ──
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast '+type+' show';
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 3000);
}

init();
</script>
